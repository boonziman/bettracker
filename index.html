<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Parlay Command Center</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      min-height: 100vh;
      padding: 12px;
      line-height: 1.4;
      -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 2px; }
    .sub { font-size: 11px; color: #a1a1aa; margin-bottom: 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .secured { text-align: right; }
    .secured .label { font-size: 10px; color: #71717a; text-transform: uppercase; }
    .secured .val { font-size: 1.35rem; font-weight: 700; color: #34d399; }

    .card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .card.live { border-color: rgba(52, 211, 153, 0.35); }
    .card-h {
      padding: 8px 12px;
      border-bottom: 1px solid #27272a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
    }
    .live-badge {
      font-size: 10px;
      color: #34d399;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .card-b { padding: 12px; }
    .score-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
    .teams { min-width: 90px; }
    .team-line { display: flex; justify-content: space-between; gap: 16px; font-size: 15px; margin: 2px 0; }
    .team-line .s { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }

    .diamond { position: relative; width: 46px; height: 46px; flex-shrink: 0; }
    .base {
      width: 13px; height: 13px; transform: rotate(45deg);
      border: 2px solid #3f3f46; position: absolute; background: transparent;
    }
    .base.occ { background: #fbbf24; border-color: #fbbf24; box-shadow: 0 0 6px rgba(251,191,36,.5); }
    .b2 { top: 0; left: 50%; margin-left: -6.5px; }
    .b1 { right: 0; top: 50%; margin-top: -6.5px; }
    .b3 { left: 0; top: 50%; margin-top: -6.5px; }
    .home { bottom: 0; left: 50%; margin-left: -6.5px; background: #71717a; border-color: #71717a; }

    .count { text-align: right; font-size: 10px; }
    .count-row { display: flex; align-items: center; justify-content: flex-end; gap: 3px; margin: 2px 0; }
    .count-row span.label { color: #71717a; width: 12px; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      border: 1.5px solid #52525b; display: inline-block;
    }
    .dot.b { background: #3b82f6; border-color: #3b82f6; }
    .dot.s { background: #ef4444; border-color: #ef4444; }
    .dot.o { background: #f97316; border-color: #f97316; }

    .track {
      background: #27272a;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
    }
    .track-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em; color: #a1a1aa; margin-bottom: 6px; }
    .k-big { font-size: 1.75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .k-big.good { color: #34d399; }
    .k-big.warn { color: #fbbf24; }
    .k-big.bad { color: #f87171; }
    .k-sub { font-size: 13px; color: #a1a1aa; font-weight: 500; }
    .track-line { display: flex; justify-content: space-between; font-size: 12px; margin: 3px 0; color: #d4d4d8; }
    .track-line .l { color: #a1a1aa; }

    table.ls { width: 100%; font-size: 10px; color: #a1a1aa; margin-top: 8px; border-collapse: collapse; }
    table.ls td { padding: 1px 3px; text-align: center; }
    table.ls td:first-child { text-align: left; color: #d4d4d8; font-weight: 500; }
    table.ls .r { font-weight: 600; color: #e4e4e7; }

    .last { font-size: 11px; color: #71717a; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    a.gc { font-size: 11px; color: #60a5fa; text-decoration: none; display: inline-block; margin-top: 4px; }

    .prog {
      background: #18181b; border: 1px solid #27272a; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 14px;
    }
    .prog-top { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; color: #a1a1aa; }
    .bar-bg { height: 4px; background: #27272a; border-radius: 99px; overflow: hidden; }
    .bar { height: 100%; background: #34d399; border-radius: 99px; transition: width .3s; width: 0%; }
    .btns { display: flex; gap: 8px; margin-top: 8px; }
    button {
      font-size: 12px; padding: 6px 12px; border-radius: 8px; border: none;
      background: #27272a; color: #e4e4e7; -webkit-appearance: none;
    }
    button.primary { color: #34d399; }
    button.danger { color: #f87171; }

    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #71717a; margin: 16px 0 8px; font-weight: 600; }

    .ticket { background: #18181b; border: 1px solid #27272a; border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
    .ticket.won { border-color: rgba(52, 211, 153, 0.45); }
    .ticket-h { padding: 10px 12px; border-bottom: 1px solid #27272a; display: flex; justify-content: space-between; align-items: center; }
    .ticket-h .name { font-size: 14px; font-weight: 600; }
    .ticket-h .meta { text-align: right; font-size: 12px; }
    .leg {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px; border-bottom: 1px solid #27272a;
    }
    .leg:last-child { border-bottom: none; }
    .leg input { margin-top: 3px; width: 16px; height: 16px; accent-color: #34d399; }
    .leg-body { flex: 1; min-width: 0; }
    .leg-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .leg-text { font-size: 14px; }
    .leg-text.done { color: #6ee7b7; }
    .pill {
      font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 99px;
      text-transform: uppercase;
    }
    .pill.won { background: rgba(52,211,153,.2); color: #34d399; }
    .pill.leaning { background: rgba(56,189,248,.15); color: #38bdf8; }
    .pill.pending { background: rgba(113,113,122,.25); color: #a1a1aa; }
    .pill.threat { background: rgba(251,191,36,.15); color: #fbbf24; }
    .pill.lost { background: rgba(248,113,113,.15); color: #f87171; }
    .leg-sub { font-size: 11px; color: #71717a; margin-top: 2px; }

    .foot { text-align: center; font-size: 10px; color: #52525b; margin-top: 20px; padding-bottom: 20px; }
    .err { color: #f87171; font-size: 13px; text-align: center; padding: 16px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="row" style="margin-bottom:4px">
      <div>
        <h1>Parlay Command Center</h1>
        <div class="sub">$55 risked · Potential $648.65</div>
      </div>
      <div class="secured">
        <div class="label">Secured</div>
        <div class="val" id="secured">$0</div>
      </div>
    </div>

    <div class="prog">
      <div class="prog-top">
        <span>Legs checked</span>
        <span id="prog-text">0/12</span>
      </div>
      <div class="bar-bg"><div class="bar" id="prog-bar"></div></div>
      <div class="btns">
        <button class="primary" id="refresh">Refresh</button>
        <button class="danger" id="reset">Reset</button>
      </div>
    </div>

    <div id="games">
      <div class="err" id="load-msg">Loading live data…</div>
    </div>

    <div class="section-title">All Bets</div>
    <div id="tickets"></div>

    <div class="foot">ESPN data · Leave open to auto-refresh · Checkboxes save on this device</div>
  </div>

    <script src="app.js"></script>
</body>
</html>
