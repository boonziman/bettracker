<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0b0c" />
  <title>Parlay Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <div class="kicker">Tonight</div>
        <h1>Command Center</h1>
        <p class="sub">$55 risked · $648.65 to collect</p>
      </div>
      <div class="money">
        <div class="kicker">Secured</div>
        <div class="val" id="secured">$0</div>
      </div>
    </header>

    <section class="bar">
      <div class="bar-row">
        <span id="prog-text">0 / 12 legs</span>
        <span class="live-meta">
          <span class="dot-live off" id="live-dot"></span>
          <span id="ago">idle</span>
        </span>
      </div>
      <div class="meter"><i id="prog-bar"></i></div>
      <div class="actions">
        <button class="primary" id="refresh" type="button">Refresh</button>
        <button class="ghost" id="reset" type="button">Reset</button>
        <label class="toggle">
          <input type="checkbox" id="autolock" checked />
          Auto-lock settled
        </label>
      </div>
    </section>

    <div class="sec">Live games</div>
    <div id="games"><div class="skel">Pulling ESPN…</div></div>

    <div class="sec">Tickets</div>
    <div id="tickets"></div>

    <p class="foot">ESPN every 8s · Checkboxes confirm · Leave this tab open</p>
  </div>
  <script src="app.js"></script>
</body>
</html>
